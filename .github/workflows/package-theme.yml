name: Package WordPress Theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/nisehatakiti-factory/**'
      - '.github/workflows/package-theme.yml'

permissions:
  contents: read

jobs:
  package-theme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create theme ZIP
        run: |
          rm -rf dist
          mkdir -p dist
          cd wp-content/themes
          zip -r "../../dist/nisehatakiti-factory.zip" nisehatakiti-factory

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: nisehatakiti-factory
          path: dist/nisehatakiti-factory.zip
          if-no-files-found: error
          retention-days: 30
